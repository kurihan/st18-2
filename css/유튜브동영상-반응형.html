<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유튜브동영상-반응형</title>
  <style>
    *{margin: 0; padding: 0;}
    .container{margin: 50px;}
    .media-box{width: 80%; max-width: 768px; min-width: 360px;}
    .media-box .media-wrap{position: relative; padding-top: 56.25%; background-color: #ccc; border: 1px solid #000;}
    .media-box .media-wrap iframe{width: 100%; height: 100%; position: absolute; left: 0; top: 0;}
  </style>
</head>
<body>
  <div class="container">
    <div class="media-box">
      <div class="media-wrap">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/Kz2BsKX04ek?si=3JzccEK8I-juKYQd" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
    </div>
  </div>
</body>
</html>
