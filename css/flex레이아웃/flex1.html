<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex1</title>
  <style>
    *{margin: 0; padding: 0;}
    body{margin: 50px;}
    .container{display: flex; flex-direction: row; justify-content: center; align-items: center; flex-wrap: wrap; gap: 20px; padding: 30px; background-color: #ccc; border: 1px solid #000;}
    .item{width: 100px; height: 100px; flex: 1 1 auto; display: flex; justify-content: center; align-items: center; flex-direction: row; background-color: dodgerblue; border: 1px solid #000;}
  </style>
</head>
<body>
  <div class="container">
    <div class="item">item1</div>
    <div class="item">item2</div>
    <div class="item">item3</div>
    <div class="item">item4</div>
  </div>
</body>
</html>
